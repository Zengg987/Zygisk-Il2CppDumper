name: Build
on:
  workflow_dispatch:
      inputs:
        package_name:
          description: "Package name of the game:"
          required: true

jobs:
  build:
    # Menggunakan ubuntu-24.04 agar kompilasi NDK/C++ tetap stabil selama masa transisi server GitHub
    runs-on: ubuntu-24.04
    steps:
    # Diperbarui ke v4 untuk performa dan keamanan terbaru
    - uses: actions/checkout@v4
    
    # Diperbarui ke v4 yang mendukung kompatibilitas Node.js terbaru
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 11
        cache: gradle
        
    - run: |
        chmod +x ./gradlew
        sed -i 's/moduleDescription = "/moduleDescription = "(${{ github.event.inputs.package_name }}) /g' module.gradle
        sed -i "s/com.game.packagename/${{ github.event.inputs.package_name }}/g" module/src/main/cpp/game.h
        ./gradlew :module:assembleRelease
        
    # UBAH UTAMA: Diperbarui ke v4 untuk memperbaiki error "deprecated version v3" yang memblokir build
    - uses: actions/upload-artifact@v4
      with:
        name: zygisk-il2cppdumper
        path: out/magisk_module_release/
